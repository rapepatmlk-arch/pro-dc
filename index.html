<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DC ลงเวลา">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="apple-touch-icon" href="logo.jpg">
<title>DC Time – PRO-CON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f2f6b; --navy2:#2c4a9a; --gold:#b48a55; --green:#1e4d2b;
  --bg:#f3f4f8; --card:#fff; --line:#dfe3ec; --ink:#1b2133; --mute:#6b7387;
  --ok:#1f8a4c; --okbg:#e5f5ec; --wait:#c46a12; --waitbg:#fdf0e2; --red:#c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,"Thonburi",system-ui,sans-serif;font-size:17px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:17px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;box-shadow:0 2px 10px #0003}
.top .logos img{height:40px;background:#fff;border-radius:8px;padding:3px;display:block}
.top h1{font-size:19px;margin:0;font-weight:700;line-height:1.2}
.top small{display:block;font-weight:400;opacity:.8;font-size:13px}
.top .sp{flex:1}
.tbtn{background:#ffffff22;color:#fff;border:1px solid #ffffff44;border-radius:10px;padding:8px 14px}
.wrap{max-width:1200px;margin:0 auto;padding:16px 16px 130px}
.banner{background:#fff6d9;border:1px solid #f0d78a;color:#7a5a00;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.blue{background:#e8ecf6;border-color:#c5cee6;color:var(--navy)}
.banner .sp{flex:1}
.ico{flex:none;vertical-align:-3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--line);box-shadow:0 2px 6px #0000000a;text-align:left}
.pcard h3{margin:0 0 6px;font-size:19px;color:var(--navy)}
.pcard p{margin:2px 0;color:var(--mute);font-size:14px}
.pcard .stat{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pnew{border:2px dashed #b8c0d6;background:transparent;color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:center;min-height:130px;font-size:19px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.wait{background:var(--waitbg);color:var(--wait)} .chip.all{background:#e8ecf6;color:var(--navy)} .chip.red{background:#fdecea;color:var(--red)} .chip.gray{background:#eceef2;color:#6b7387}
.phead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.phead .info{flex:1;min-width:260px;font-size:15px;line-height:1.55}
.phead .info b{display:inline-block;min-width:96px;color:var(--navy)}
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs.sm button{padding:6px 14px;font-size:15px}
.ibtn{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:8px;padding:6px 12px;color:var(--navy);border:1px solid var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fffffff2;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:13px 18px;font-weight:700;background:#e8ecf6;color:var(--navy);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.pri{background:var(--navy);color:#fff}
.btn.big{font-size:19px;padding:14px 26px}
.btn.gold{background:var(--gold);color:#fff}
.btn.okb{background:var(--ok);color:#fff}
.btn.del{background:#fdecea;color:var(--red)}
.btn.sm{padding:8px 12px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.5}
.empty-state{text-align:center;color:var(--mute);padding:44px 10px}
.empty-state .big{color:#9aa7c7;margin-bottom:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;color:var(--navy);font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
/* day nav + mode buttons */
.dnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dnav input{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.dnav .lbl{font-weight:700;color:var(--navy);font-size:18px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media (max-width:700px){.modes{grid-template-columns:repeat(2,1fr)}}
.mbtn{border:none;border-radius:16px;padding:14px 10px;color:#fff;font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 10px #0002}
.mbtn small{font-weight:400;font-size:14px;opacity:.9}
.mbtn .mi{width:46px;height:46px;border-radius:50%;background:#ffffff2a;display:flex;align-items:center;justify-content:center}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line);background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th{background:var(--navy);color:#fff;font-weight:600;padding:8px 6px;text-align:center;white-space:nowrap;font-size:14px}
table.t td{border-top:1px solid var(--line);padding:6px;text-align:center;white-space:nowrap}
table.t td.l,table.t th.l{text-align:left}
table.t td.r,table.t th.r{text-align:right}
table.t tr.click{cursor:pointer}
table.t tr.click:active{background:#f1f4fb}
table.t tr.tot td{background:#e8ecf6;font-weight:700;color:var(--navy)}
table.t tr.off td{color:#a3aaba}
table.t td.pres{background:#eef8f2}
table.t .tm{font-size:13px;line-height:1.25}
table.t .ot{color:var(--navy2);font-weight:600;font-size:12px}
.late{color:var(--wait);font-weight:700}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#dde2ec;display:block;margin:auto}
.av.lg{width:72px;height:72px}
.nm{font-weight:600}
.sub{color:var(--mute);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat .k{color:var(--mute);font-size:14px}
.stat .v{font-size:28px;font-weight:700;color:var(--navy);line-height:1.2}
.stat .s{font-size:13px;color:var(--mute)}
.stat.hl{background:linear-gradient(135deg,var(--navy),var(--navy2));border:none}
.stat.hl .k,.stat.hl .s{color:#ffffffcc}.stat.hl .v{color:#fff}
.wcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left}
.wcard.off{opacity:.55}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wnew{border:2px dashed #b8c0d6;background:transparent;color:var(--navy);font-weight:700;justify-content:center;min-height:96px}
/* logs */
.log{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
.log h4{margin:0 0 6px;color:var(--navy);font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.log p{margin:4px 0;white-space:pre-wrap;font-size:15px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:96px;height:72px;object-fit:cover;border-radius:8px;background:#e7eaf2}
/* sheet */
.ov{position:fixed;inset:0;background:#0b1230aa;z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center}}
.sheet{background:#fff;width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet h2{margin:0 0 12px;color:var(--navy);font-size:21px;display:flex;align-items:center;gap:10px}
.fld{margin-bottom:14px}
.fld label{display:block;font-weight:600;color:var(--navy);margin-bottom:5px;font-size:15px}
.mic-row{display:flex;gap:8px;align-items:stretch}
.mic-row input,.mic-row textarea,.fld input,.fld select,.fld textarea{flex:1;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fbfcfe;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.mic{flex:none;width:50px;height:50px;align-self:flex-start;border:none;border-radius:50%;background:linear-gradient(145deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #1f2f6b40;transition:transform .15s}
.mic:active{transform:scale(.92)}
.mic.on{background:linear-gradient(145deg,#e5533d,#c0392b);animation:ring 1.3s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 #c0392b80}70%{box-shadow:0 0 0 12px #c0392b00}100%{box-shadow:0 0 0 0 #c0392b00}}
.partial{color:var(--mute);font-style:italic;font-size:14px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .p{position:relative;width:118px;height:118px;border-radius:10px;overflow:hidden;background:#e7eaf2}
.photos .p img{width:100%;height:100%;object-fit:cover}
.photos .p .x{position:absolute;top:4px;right:4px;background:#000b;color:#fff;border:none;border-radius:999px;width:28px;height:28px;font-size:15px;line-height:28px;padding:0}
.addp{width:118px;height:118px;border-radius:10px;border:2px dashed #b8c0d6;background:#fafbfe;color:var(--navy);font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.addp-ic{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.regph{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.regbox{border:1.5px dashed #b8c0d6;border-radius:14px;background:#fafbfe;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;position:relative;overflow:hidden}
.regbox img{max-width:100%;max-height:230px;border-radius:10px;object-fit:contain}
.regbox .rb{display:flex;gap:6px}
.fstat{font-size:14px;margin-top:6px;min-height:20px}
.fstat.ok{color:var(--ok)}.fstat.bad{color:var(--red)}.fstat.wait{color:var(--wait)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.acts .sp{flex:1}
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt label{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:6px;align-items:center;font-weight:400;color:var(--ink);margin:0}
.opt input{width:auto;flex:none}
.hint{font-size:13px;color:var(--mute);margin-top:4px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1b2133;color:#fff;padding:11px 18px;border-radius:12px;z-index:95;font-size:15px;max-width:90vw;text-align:center;box-shadow:0 6px 24px #0005}
.viewer{position:fixed;inset:0;background:#000e;z-index:90;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:96vw;max-height:88vh}
.viewer button{position:absolute;top:16px;right:16px}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}
.pages img{width:100%;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 8px #0002}
.prog{height:8px;background:#e8ecf6;border-radius:999px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--navy);width:0;transition:width .2s}
.wlist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px}
.wlist label{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;font-weight:400;color:var(--ink);margin:0}
.wlist label:active{background:#f1f4fb}
.wlist input{width:22px;height:22px;flex:none}
.wlist img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#dde2ec;flex:none}
.wlist .grow{flex:1}
.wlist button{display:flex;align-items:center;gap:10px;border:none;background:none;text-align:left;padding:6px 8px;border-radius:10px;width:100%}
.wlist button:active{background:#f1f4fb}
/* scanner */
.scan{position:fixed;inset:0;z-index:45;background:#0b1230;color:#fff;display:flex;flex-direction:column}
.scan-top{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));flex-wrap:wrap}
.scan-top .seg{display:flex;background:#ffffff14;border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.scan-top .seg button{border:none;background:none;color:#fff;padding:8px 14px;border-radius:9px;font-weight:600}
.scan-top .seg button.on{background:#fff;color:var(--navy)}
.scan-top .clk{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.scan-top .sp{flex:1}
.scan-main{flex:1;display:flex;min-height:0;gap:10px;padding:0 10px}
@media (max-width:820px){.scan-main{flex-direction:column}}
.stage{flex:1;position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:200px}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage canvas{display:none}
.stage .msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000a;padding:6px 14px;border-radius:999px;font-size:15px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.stage .guide{position:absolute;left:4%;right:4%;top:18%;bottom:30%;border:2px dashed #ffffff55;border-radius:16px;pointer-events:none}
.side{width:330px;display:flex;flex-direction:column;background:#ffffff0d;border-radius:14px;min-height:0}
@media (max-width:820px){.side{width:auto;max-height:34vh}}
.side h3{margin:0;padding:10px 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.res{flex:1;overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
.ri{display:flex;align-items:center;gap:8px;background:#ffffff12;border-radius:12px;padding:6px 8px}
.ri img{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;background:#333}
.ri .g{flex:1;min-width:0}
.ri .g b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .g span{font-size:13px;opacity:.8}
.ri.unk{background:#c46a1233;cursor:pointer}
.ri .x{background:#ffffff22;border:none;color:#fff;border-radius:999px;width:30px;height:30px;flex:none}
.scan-bar{display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));flex-wrap:wrap;align-items:center;justify-content:center}
.scan-bar .btn{background:#ffffff1c;color:#fff}
.scan-bar .btn.shot{background:#fff;color:var(--navy);font-size:20px;padding:15px 30px}
.scan-bar .btn.save{background:var(--ok)}
.scan-bar .btn.on{background:var(--gold)}
</style>
</head>
<body>
<div class="top">
  <div class="logos"><img src="logo.jpg" alt="PRO-CON"></div>
  <div><h1 id="topTitle">ลงเวลาแรงงานรายวัน (DC)</h1><small id="topSub">PRO CONSTRUCTION & DESIGN</small></div>
  <div class="sp"></div>
  <span class="tbtn" id="syncBadge" style="display:none;font-size:14px"></span>
  <button class="tbtn" id="backBtn" style="display:none">‹ โครงการทั้งหมด</button>
</div>
<div class="wrap" id="main"><div class="empty-state">กำลังเปิดแอป…</div></div>
<div class="bar" id="bar" style="display:none"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="selfIn" accept="image/*" capture="user" hidden>
<input type="file" id="libIn" accept="image/*" multiple hidden>
<div id="layer"></div>

<script src="lib/firebase-app-compat.js"></script>
<script src="lib/firebase-auth-compat.js"></script>
<script src="lib/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>

  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.idb.transaction(store,mode);const out=fn(t.objectStore(store));t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})},

const CloudDB={kind:"cloud",urls:new Map(),blobs:new Map(),cache:{},unsubs:[],pending:0,
  COLS:["projects","workers","att","logs","weeks","payees","cfg"],
  init(){this.fs=firebase.firestore();this.FV=firebase.firestore.FieldValue},
  start(){
    this.stop();this.COLS.forEach(c=>this.cache[c]=new Map());
    return Promise.all(this.COLS.map(c=>new Promise(res=>{let first=true;
      this.unsubs.push(this.fs.collection(c).onSnapshot(snap=>{
        let remote=false;
        snap.docChanges().forEach(ch=>{const d=ch.doc;if(!d.metadata.hasPendingWrites)remote=true;
          if(c==="att"){const old=[...this.cache.att.keys()].filter(k=>k.startsWith(d.id+"|"));old.forEach(k=>this.cache.att.delete(k));
            if(ch.type!=="removed"){const v=d.data();for(const [wid,r] of Object.entries(v.recs||{}))this.cache.att.set(d.id+"|"+wid,{...r,id:d.id+"|"+wid,pid:v.pid,date:v.date,wid})}}
          else if(ch.type==="removed")this.cache[c].delete(d.id);else this.cache[c].set(d.id,this.decode(c,{...d.data(),id:d.id}))});
        if(first){first=false;res()}else if(remote)onCloudChange();
      },e=>{console.error(c,e);if(first){first=false;res()}toast("โหลดข้อมูลไม่ได้ ("+(e.code||e)+")",4000)}));
    })));
  },
  stop(){this.unsubs.forEach(u=>u());this.unsubs=[]},
  decode(c,v){if(c==="workers"&&Array.isArray(v.descs))v.descs=v.descs.map(x=>x&&x.v?x.v:x);return v},
  encode(c,v){v=clone(v);delete v.id;if(c==="workers"&&Array.isArray(v.descs))v.descs=v.descs.map(a=>({v:a}));return v},
  track(p){this.pending++;syncBadge();p.catch(e=>{console.error(e);toast(e&&e.code==="permission-denied"?"ทำรายการนี้ได้เฉพาะแอดมิน — ระบบย้อนข้อมูลกลับแล้ว":"บันทึกขึ้นคลาวด์ไม่สำเร็จ ("+(e&&e.code||e)+")",4000)}).finally(()=>{this.pending--;syncBadge()})},
  async all(s){
    if(s==="projects"){const out=[...this.cache.projects.values()].map(clone);const c=this.cache.cfg.get("main");if(c)out.push({...clone(c),id:"_cfg"});return out}
    return [...(this.cache[s]||new Map()).values()].map(clone);
  },
  async put(s,v,k){
    if(s==="photos")return this.putPhoto(k,v);
    if(s==="projects"&&v.id==="_cfg"){this.cache.cfg.set("main",clone(v));this.track(this.fs.collection("cfg").doc("main").set(this.encode("cfg",v)));return}
    if(s==="att"){const r=clone(v);const day=r.pid+"|"+r.date;this.cache.att.set(r.id,r);const rec={...r};delete rec.id;
      this.track(this.fs.collection("att").doc(day).set({pid:r.pid,date:r.date,recs:{[r.wid]:rec}},{merge:true}));return}
    this.cache[s].set(v.id,clone(v));this.track(this.fs.collection(s).doc(v.id).set(this.encode(s,v)));
  },
  async del(s,k){
    if(s==="att"){const r=this.cache.att.get(k);this.cache.att.delete(k);if(!r)return;
      this.track(this.fs.collection("att").doc(r.pid+"|"+r.date).update(new firebase.firestore.FieldPath("recs",r.wid),this.FV.delete()));return}
    this.cache[s].delete(k);this.track(this.fs.collection(s).doc(k).delete());
  },
  async shrink(blob){let b=blob,q=0.8,sc=1;while(b.size>900000&&sc>0.3){const u=URL.createObjectURL(blob);try{const img=await loadImg(u);sc*=0.8;const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);b=await toBlob(c,q)}finally{URL.revokeObjectURL(u)}}return b},
  async putPhoto(id,blob){blob=await this.shrink(blob);this.blobs.set(id,blob);const bytes=new Uint8Array(await blob.arrayBuffer());
    this.track(this.fs.collection("photos").doc(id).set({data:firebase.firestore.Blob.fromUint8Array(bytes),type:blob.type||"image/jpeg",size:bytes.length,at:Date.now(),by:(USER&&USER.email)||""}));return id},
  async photo(blob){const id="ph_"+uid();await this.putPhoto(id,blob);return id},
  async blob(id){if(this.blobs.has(id))return this.blobs.get(id);const ref=this.fs.collection("photos").doc(id);let d=null;
    try{d=await ref.get({source:"cache"})}catch(e){}if(!d||!d.exists){try{d=await ref.get()}catch(e){return null}}
    if(!d.exists)return null;const v=d.data();const b=new Blob([v.data.toUint8Array()],{type:v.type||"image/jpeg"});this.blobs.set(id,b);return b},
  src:LocalDB.src,
};

/* ================= pay rules ================= */
function dayF(r){if(r.dayF!==""&&r.dayF!=null)return +r.dayF;return (r.in||r.out)?1:0}
function otH(r){if(r.otH!==""&&r.otH!=null)return +r.otH;if(!r.otIn||!r.otOut)return 0;let m=mins(r.otOut)-mins(r.otIn);if(m<0)m+=1440;return Math.floor(m/30)/2}
function otRateHr(r){if(r.otHr!==""&&r.otHr!=null&&+r.otHr>0)return +r.otHr;return (+r.wage||0)/(+CFG.hoursPerDay||8)*(+CFG.otRate||1.5)}
function pay(r){const d=dayF(r),h=otH(r);const n=(+r.wage||0)*d,o=h*otRateHr(r);return {d,h,n,o,t:n+o}}
function summarize(recs){
  const by=new Map();const tot={d:0,h:0,n:0,o:0,t:0,people:0};
  for(const r of recs){const p=pay(r);let x=by.get(r.wid);if(!x){x={wid:r.wid,d:0,h:0,n:0,o:0,t:0,recs:[]};by.set(r.wid,x)}
    x.d+=p.d;x.h+=p.h;x.n+=p.n;x.o+=p.o;x.t+=p.t;x.recs.push(r);tot.d+=p.d;tot.h+=p.h;tot.n+=p.n;tot.o+=p.o;tot.t+=p.t}
  tot.people=[...by.values()].filter(x=>x.d>0||x.h>0).length;return {by,tot};
}

const iou=(a,b)=>{const x1=Math.max(a.x,b.x),y1=Math.max(a.y,b.y),x2=Math.min(a.x+a.w,b.x+b.w),y2=Math.min(a.y+a.h,b.y+b.h);const i=Math.max(0,x2-x1)*Math.max(0,y2-y1);return i/(a.w*a.h+b.w*b.h-i||1)};
// whole frame + overlapping tiles, so small faces in a long line-up are still found
async function detectAll(c,fine=true){
  const out=[];const push=(d,ox,oy)=>{const b=d.detection.box;const box={x:b.x+ox,y:b.y+oy,w:b.width,h:b.height};const sc=d.detection.score;
    const dup=out.find(o=>iou(o.box,box)>0.3);if(dup){if(sc>dup.score){dup.box=box;dup.score=sc;dup.desc=d.descriptor}return}out.push({box,score:sc,desc:d.descriptor})};
  (await detectRaw(c)).forEach(d=>push(d,0,0));
  if(fine&&c.width>=1000){
    const cols=c.width>=1700?3:2, rows=c.height>c.width*0.8?3:2;const tw=c.width/cols*1.35, th=c.height/rows*1.35;
    for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
      const x=Math.max(0,Math.min(c.width-tw,i*c.width/cols-(tw-c.width/cols)/2)),y=Math.max(0,Math.min(c.height-th,j*c.height/rows-(th-c.height/rows)/2));
      const t=document.createElement("canvas");t.width=Math.round(tw);t.height=Math.round(th);t.getContext("2d").drawImage(c,x,y,tw,th,0,0,t.width,t.height);
      (await detectRaw(t)).forEach(d=>push(d,x,y));
    }
  }
  return out;
}
async function cropFace(c,box,size=220,q=0.85){const m=box.w*0.45;const s=Math.max(box.w,box.h)+2*m;const cx=box.x+box.w/2,cy=box.y+box.h/2;
  const t=document.createElement("canvas");t.width=t.height=size;const g=t.getContext("2d");g.fillStyle="#ccc";g.fillRect(0,0,size,size);g.drawImage(c,cx-s/2,cy-s/2,s,s,0,0,size,size);return await toBlob(t,q)}

let matcherDirty=true,matcher=[];
function getMatcher(){if(matcherDirty){matcher=S.workers.filter(w=>w.active!==false&&w.descs&&w.descs.length).map(w=>({wid:w.id,ds:w.descs.map(a=>Float32Array.from(a))}));matcherDirty=false}return matcher}
const thresh=()=>+(CFG.thresh||0.5);
function bestDist(desc,ds){let m=9;for(const q of ds){const e=faceapi.euclideanDistance(desc,q);if(e<m)m=e}return m}
function matchFaces(dets){
  const M=getMatcher(),T=thresh();const pairs=[];
  dets.forEach((d,i)=>M.forEach(x=>{const m=bestDist(d.desc,x.ds);if(m<T)pairs.push({i,wid:x.wid,m})}));
  pairs.sort((a,b)=>a.m-b.m);const di=new Map(),wu=new Set();
  for(const p of pairs){if(di.has(p.i)||wu.has(p.wid))continue;di.set(p.i,p);wu.add(p.wid)}
  return dets.map((d,i)=>({...d,wid:di.get(i)?.wid||null,dist:di.get(i)?.m??null}));
}
function similarWorker(desc,exceptId){const M=getMatcher();let best=null;for(const x of M){if(x.wid===exceptId)continue;const m=bestDist(desc,x.ds);if(m<thresh()&&(!best||m<best.m))best={wid:x.wid,m}}return best}

/* ================= dictation (iPad keyboard mic fallback) ================= */
/* iPad Safari: a second `new SpeechRecognition()` on the same page often never hears anything,
   so ONE recognizer is reused for every field. Tapping another field's mic while listening just
   moves the target field; tapping the same mic again stops. */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let srRec=null,srOn=false,srBtn=null,srTarget=null;
const srPart=()=>srTarget?.closest(".fld")?.querySelector(".partial");
function srIdle(){srOn=false;document.querySelectorAll(".mic.on").forEach(b=>b.classList.remove("on"));document.querySelectorAll(".partial").forEach(p=>p.textContent="")}
function srGet(){
  if(srRec)return srRec;const r=new SR();r.lang="th-TH";r.interimResults=true;r.continuous=false;
  r.onresult=e=>{const input=srTarget;if(!input||!input.isConnected)return;let fin="",tmp="";
    for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else tmp+=t}
    const part=srPart();if(part)part.textContent=tmp?"🎙 "+tmp:"";if(fin){const v=input.value;input.value=(v&&!/\s$/.test(v)?v+" ":v)+fin.trim()}};
  r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed")toast("ใช้ไมค์ในหน้านี้ไม่ได้ — แตะช่องแล้วกดไมค์บนแป้นพิมพ์ iPad แทน",3500)};
  r.onend=srIdle;return srRec=r;
}
function srStop(){if(srRec&&srOn){try{srRec.stop()}catch(e){}}}
function micClick(btn){
  const input=btn.parentElement.querySelector("input,textarea");
  if(!SR){input.focus();toast("แตะปุ่ม 🎤 บนแป้นพิมพ์ iPad แล้วพูดได้เลย",3200);return}
  const r=srGet();
  if(srOn){
    if(srBtn===btn){srStop();return}
    if(srBtn)srBtn.classList.remove("on");const op=srPart();if(op)op.textContent="";
    srBtn=btn;srTarget=input;btn.classList.add("on");return;
  }
  srBtn=btn;srTarget=input;btn.classList.add("on");
  const go=()=>{r.start();srOn=true};
  try{go()}catch(e){setTimeout(()=>{try{go()}catch(_){btn.classList.remove("on");input.focus();toast("เริ่มฟังเสียงไม่ได้ — ลองกดไมค์อีกครั้ง",2500)}},400)}
}

function weekMatrix(mon){
  const days=[...Array(7)].map((_,i)=>addDays(mon,i));const sun=days[6];
  const recs=recsBetween(mon,sun);const sm=summarize(recs);
  const ws=sortedWorkers().filter(w=>sm.by.has(w.id));
  let h=`<div class="tw"><table class="t"><tr><th>ที่</th><th class="l">ชื่อ</th><th>ค่าแรง</th>${days.map(d=>`<th>${TH_D[parse(d).getDay()]}<br><span style="font-weight:400;font-size:12px">${thShort(d)}</span></th>`).join("")}<th>วัน</th><th>OT ชม.</th><th class="r">ปกติ</th><th class="r">OT</th><th class="r">รวม</th></tr>`;
  ws.forEach((w,i)=>{const x=sm.by.get(w.id);
    h+=`<tr><td>${i+1}</td><td class="l nm">${esc(w.name)}</td><td>${fmt(w.wage)}</td>${days.map(d=>{const r=x.recs.find(r=>r.date===d);if(!r)return"<td>–</td>";const p=pay(r);return `<td class="${p.d?"pres":""} click" data-rd="${w.id}|${d}"><div class="tm">${p.d?(p.d===0.5?"½":"✓"):"–"}${r.in?" "+r.in:""}</div>${p.h?`<div class="ot">OT ${p.h}</div>`:""}</td>`}).join("")}<td>${fmt(x.d)}</td><td>${fmt(x.h)}</td><td class="r">${fmt(x.n)}</td><td class="r">${fmt(x.o)}</td><td class="r"><b>${fmt(x.t)}</b></td></tr>`});
  const dt=days.map(d=>summarize(recs.filter(r=>r.date===d)).tot);
  h+=`<tr class="tot"><td colspan="3" class="l">รวม</td>${dt.map(t=>`<td><div class="tm">${t.people} คน</div><div class="tm">${fmt0(t.t)}</div></td>`).join("")}<td>${fmt(sm.tot.d)}</td><td>${fmt(sm.tot.h)}</td><td class="r">${fmt(sm.tot.n)}</td><td class="r">${fmt(sm.tot.o)}</td><td class="r">${fmt(sm.tot.t)}</td></tr></table></div>`;
  if(ws.length&&S.payees.length){const g=payGroups(sm);h+=`<div class="tw" style="margin-top:12px"><table class="t"><tr><th class="l">จ่ายเงินให้</th><th class="l">ธนาคาร</th><th class="l">เลขที่บัญชี</th><th>คนงาน</th><th class="r">ยอดจ่ายรอบนี้</th></tr>${g.map(x=>`<tr><td class="l nm">${esc(x.name)}</td><td class="l">${esc(x.bank||"-")}</td><td class="l">${esc(x.acct||"-")}</td><td>${x.n} คน</td><td class="r"><b>${fmt2(x.t)}</b></td></tr>`).join("")}</table></div>`}
  if(!ws.length)h=`<div class="empty-state">ยังไม่มีการลงเวลาในรอบนี้</div>`;
  return {html:h,sm};
}

const BANKS=["กสิกรไทย","กรุงไทย","ไทยพาณิชย์","กรุงเทพ","กรุงศรีอยุธยา","ทหารไทยธนชาต (ttb)","ออมสิน","ธ.ก.ส.","ยูโอบี","ซีไอเอ็มบี","เกียรตินาคินภัทร","แลนด์ แอนด์ เฮ้าส์","พร้อมเพย์"];
const payeeOf=id=>id?S.payees.find(x=>x.id===id):null;
const payOpts=sel=>`<option value="">— ยังไม่ระบุ / จ่ายตัวคนงานเอง —</option>${S.payees.map(x=>`<option value="${esc(x.id)}" ${sel===x.id?"selected":""}>${esc(x.name)}${x.bank?" • "+esc(x.bank):""}</option>`).join("")}`;
function payGroups(sm){const m=new Map();for(const [wid,x] of sm.by){if(!x.t)continue;const w=W(wid);const pid=w&&payeeOf(w.payee)?w.payee:"";let g=m.get(pid);if(!g){const py=payeeOf(pid);g={id:pid,name:py?py.name:"ไม่ระบุผู้รับเงิน",bank:py?.bank,acct:py?.acct,acctName:py?.acctName,n:0,t:0};m.set(pid,g)}g.n++;g.t+=x.t}
  return [...m.values()].sort((a,b)=>(a.id?S.payees.findIndex(x=>x.id===a.id):999)-(b.id?S.payees.findIndex(x=>x.id===b.id):999))}
function payeeList(){
  const sh=openSheet(`<h2>${I("money",24)} ผู้รับเงิน / หัวหน้าชุด</h2><p class="hint" style="margin-top:-6px">ค่าแรงของคนงานแต่ละคนจะรวมจ่ายให้ผู้รับเงินที่เลือกไว้ตอนลงทะเบียน (เช่น หัวหน้าชุด) — แสดงในหน้าสรุปและ PDF</p>
   <div class="wlist" id="pyL"></div><div class="acts"><button class="btn pri" id="pyNew">＋ เพิ่มผู้รับเงิน</button><span class="sp"></span><button class="btn" id="pyC">ปิด</button></div>`);
  const draw=()=>{sh.querySelector("#pyL").innerHTML=S.payees.map(x=>`<button data-py="${esc(x.id)}"><span class="grow"><b>${esc(x.name)}</b> <span class="chip all">${S.workers.filter(w=>w.payee===x.id&&w.active!==false).length} คน</span><br><span class="sub">${esc(x.bank||"-")} • ${esc(x.acct||"-")}</span></span>${I("pen")}</button>`).join("")||`<div class="hint" style="padding:10px">ยังไม่มี — กด “เพิ่มผู้รับเงิน”</div>`;
    sh.querySelectorAll("[data-py]").forEach(b=>b.onclick=()=>editPayee(payeeOf(b.dataset.py),()=>payeeList()))};
  draw();sh.querySelector("#pyNew").onclick=()=>editPayee(null,()=>payeeList());sh.querySelector("#pyC").onclick=()=>{closeSheet();render()};
}
function editPayee(x,onDone,stack){
  const n=!x;x=x?clone(x):{id:uid(),name:"",bank:"",acct:"",acctName:"",phone:"",createdAt:Date.now()};
  const ov=document.createElement("div");ov.className="ov";ov.style.zIndex=60;
  ov.innerHTML=`<div class="sheet" style="max-width:620px"><h2>${I("money",24)} ${n?"เพิ่มผู้รับเงิน":"แก้ไขผู้รับเงิน"}</h2>
   ${micField("yName","ชื่อผู้รับเงิน (เช่น หัวหน้าชุด)",x.name,false,"เช่น นายสมปอง หัวหน้าชุด 1")}
   <div class="row"><div class="fld"><label>ธนาคาร</label><input id="yBank" list="bankList" value="${esc(x.bank)}" placeholder="เลือกหรือพิมพ์"><datalist id="bankList">${BANKS.map(b=>`<option value="${b}">`).join("")}</datalist></div>${fld("yAcct","เลขที่บัญชี / พร้อมเพย์",x.acct,"text","xxx-x-xxxxx-x",'inputmode="numeric"')}</div>
   <div class="row">${micField("yAName","ชื่อบัญชี (ถ้าไม่ตรงกับชื่อผู้รับเงิน)",x.acctName,false)}${fld("yPhone","เบอร์โทร",x.phone,"tel")}</div>
   <div class="acts">${n?"":`<button class="btn del" id="yDel">${I("trash")} ลบ</button>`}<span class="sp"></span><button class="btn" id="yC">ยกเลิก</button><button class="btn pri" id="yS">บันทึก</button></div></div>`;
  document.body.appendChild(ov);const q=s=>ov.querySelector(s);
  q("#yC").onclick=()=>ov.remove();
  q("#yS").onclick=async()=>{if(!needAdmin())return;const name=q("#yName").value.trim();if(!name){toast("กรุณาใส่ชื่อผู้รับเงิน");return}
    Object.assign(x,{name,bank:q("#yBank").value.trim(),acct:q("#yAcct").value.trim(),acctName:q("#yAName").value.trim(),phone:q("#yPhone").value.trim(),updatedAt:Date.now()});
    await DB.put("payees",clone(x));upsert(S.payees,x);ov.remove();toast("บันทึกแล้ว",1200);onDone&&onDone(x)};
  if(!n)q("#yDel").onclick=async()=>{if(!needAdmin())return;const c=S.workers.filter(w=>w.payee===x.id);if(!await ask(`ลบ “${x.name}”?${c.length?` (คนงาน ${c.length} คนจะกลายเป็น “ยังไม่ระบุผู้รับเงิน”)`:""}`,"ลบ"))return;
    for(const w of c){w.payee="";await saveW(w)}await DB.del("payees",x.id);S.payees=S.payees.filter(y=>y.id!==x.id);ov.remove();onDone&&onDone(x)};
}

/* ================= worker register / edit ================= */
function editWorker(w,pre){
  const n=!w;
  w=w?clone(w):{id:uid(),site:S.pid||"",no:(S.workers.reduce((m,x)=>Math.max(m,x.no||0),0)+1),name:"",role:"",wage:S.lastWage||"",otHr:"",phone:"",full:"",face:"",descs:[],active:true,createdAt:Date.now()};
  const tmp={full:null,face:null,descs:[]};// new, not yet saved
  if(pre){tmp.face=pre.blob;tmp.descs.push(descArr(pre.desc))}
  const sh=openSheet(`<h2>${I(n?"uplus":"pen",24)} ${n?"ลงทะเบียนคนงานใหม่":"ข้อมูลคนงาน"}</h2>
   <div class="regph">
     <div><label style="font-weight:600;color:var(--navy);font-size:15px">รูปตัวเต็ม</label><div class="regbox" id="bxFull"></div></div>
     <div><label style="font-weight:600;color:var(--navy);font-size:15px">รูปใบหน้า (ใช้จดจำ)</label><div class="regbox" id="bxFace"></div><div class="fstat" id="fSt"></div></div>
   </div>
   <p class="hint">ถ่ายรูปหน้าตรง ไม่ใส่หมวก/แว่นดำ แสงสว่างพอ • ถ่ายรูปหน้าเพิ่มได้หลายครั้งเพื่อให้จำแม่นขึ้น (เช่น ใส่หมวกนิรภัย / ไม่ใส่)</p>
   ${micField("wName","ชื่อ – นามสกุล / ชื่อเล่น",w.name,false,"เช่น นายสมชาย ใจดี (ชาย)")}
   <div class="row">${fld("wWage","ค่าแรง (บาท/วัน)",w.wage,"number","เช่น 400",'inputmode="decimal"')}${fld("wOt","ค่า OT (บาท/ชม.) — เว้นว่าง = คิดอัตโนมัติ",w.otHr,"number","อัตโนมัติ",'inputmode="decimal"')}</div>
   <div class="row">${micField("wRole","ตำแหน่ง / ประเภทงาน",w.role,false,"เช่น ช่างปูน, กรรมกร")}${fld("wPhone","เบอร์โทร",w.phone,"tel","")}</div>
   <div class="fld"><label>จ่ายเงินให้ (ผู้รับเงิน / หัวหน้าชุด)</label><div class="mic-row"><select id="wPay">${payOpts(w.payee)}</select><button type="button" class="btn sm" id="wPayNew">＋ เพิ่มผู้รับเงิน</button></div><div class="hint" id="wPayInfo"></div></div>
   <div class="fld"><label>ประจำโครงการ</label><select id="wSite"><option value="">ไม่ระบุ (ไปได้ทุกโครงการ)</option>${S.projects.map(p=>`<option value="${esc(p.id)}" ${w.site===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>
   ${n&&S.pid?`<div class="fld"><div class="opt"><label><input type="checkbox" id="wNow" ${new Date().getHours()<17?"checked":""}> ลงเวลาเข้างานวันนี้ด้วย (กรณีมาสาย / มาใหม่)</label><input type="time" id="wNowT" value="${hmNow()}" style="width:auto;flex:none"></div></div>`:
   !n?`<div class="fld"><div class="opt"><label><input type="checkbox" id="wAct" ${w.active!==false?"checked":""}> ยังทำงานอยู่ (ปิด = พักงาน/ลาออก ไม่ต้องสแกน)</label></div></div>`:""}
   <div class="acts">${n?"":`<button class="btn del" id="wDel">${I("trash")} ลบ</button>${w.descs?.length?`<button class="btn" id="wReset">ล้างข้อมูลใบหน้า (${w.descs.length})</button>`:""}`}<span class="sp"></span><button class="btn" id="wC">ยกเลิก</button><button class="btn pri" id="wS">บันทึก</button></div>`);
  const st=sh.querySelector("#fSt");
  const setSt=(t,c)=>{st.textContent=t;st.className="fstat "+(c||"")};
  const drawBoxes=async()=>{
    const fu=tmp.full?URL.createObjectURL(tmp.full):w.full?await DB.src(w.full):"";
    const fa=tmp.face?URL.createObjectURL(tmp.face):w.face?await DB.src(w.face):"";
    const btns=(k,self)=>`<div class="rb"><button class="btn sm pri" data-pk="${k}:${self?"self":"cam"}">${I("cam")} ถ่าย</button><button class="btn sm" data-pk="${k}:lib">${I("img")} คลังรูป</button></div>`;
    sh.querySelector("#bxFull").innerHTML=(fu?`<img src="${fu}">`:`<span style="color:#9aa3b5">${I("users",48)}</span>`)+btns("full");
    sh.querySelector("#bxFace").innerHTML=(fa?`<img src="${fa}">`:`<span style="color:#9aa3b5">${I("scan",48)}</span>`)+btns("face");
    sh.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{const [k,src]=b.dataset.pk.split(":");pick(src,fs=>handle(k,fs[0]))});
  };
  const curDescs=()=>[...(w.descs||[]),...tmp.descs];
  const showCount=()=>{const c=curDescs().length;if(c)setSt(`✓ มีข้อมูลใบหน้า ${c} ภาพ`,"ok");else setSt("ยังไม่มีข้อมูลใบหน้า — ถ่ายรูปหน้าก่อนบันทึก","wait")};
  async function handle(k,file){
    setSt("กำลังประมวลผลรูป…","wait");
    try{
      const c=await fileToCanvas(file,1600);
      if(k==="full")tmp.full=await toBlob(c);
      await drawBoxes();
      try{await ensureFace(m=>setSt(m,"wait"))}catch(e){setSt("โหลดระบบจดจำใบหน้าไม่ได้ (ต้องต่ออินเทอร์เน็ตครั้งแรก)","bad");return}
      setSt("กำลังหาใบหน้าในรูป…","wait");
      const dets=(await detectAll(c,false)).sort((a,b)=>b.box.w*b.box.h-a.box.w*a.box.h);
      if(!dets.length){if(k==="face"){tmp.face=await toBlob(c);await drawBoxes()}setSt(k==="face"?"✕ ไม่พบใบหน้าในรูป — ลองถ่ายใหม่ให้หน้าชัด/ใกล้ขึ้น":"รูปตัวเต็มบันทึกแล้ว (ไม่พบใบหน้าชัดในรูปนี้ — ถ่ายรูปหน้าแยก)","bad");return}
      const d=dets[0];
      const sim=similarWorker(d.desc,w.id);
      if(sim&&!(await ask(`ใบหน้านี้คล้ายกับ “${W(sim.wid)?.name}” ที่ลงทะเบียนไว้แล้ว — ยืนยันว่าเป็นคนละคน?`,"ใช่ คนละคน",false))){setSt("ยกเลิกรูปนี้","bad");if(k==="full")tmp.full=null;await drawBoxes();return}
      tmp.descs.push(descArr(d.desc));
      if(k==="face"||(!tmp.face&&!w.face)){tmp.face=await cropFace(c,d.box,400,0.86);await drawBoxes()}
      showCount();
    }catch(e){console.error(e);setSt("ประมวลผลรูปไม่สำเร็จ: "+(e.message||e),"bad")}
  }
  drawBoxes();showCount();
  if(!n&&!isAdmin()){["#wWage","#wOt","#wPay"].forEach(q=>{const e=sh.querySelector(q);if(e){e.disabled=true;e.title="แก้ได้เฉพาะแอดมิน"}});sh.querySelector("#wPayNew").style.display="none"}
  const payInfo=()=>{const x=payeeOf($("#wPay").value);$("#wPayInfo").textContent=x?`${x.bank||"-"} • เลขที่บัญชี ${x.acct||"-"}${x.acctName&&x.acctName!==x.name?" • ชื่อบัญชี "+x.acctName:""}`:"จ่ายเงินสดให้คนงานเอง / ยังไม่ระบุ"};
  $("#wPay").onchange=payInfo;payInfo();
  sh.querySelector("#wPayNew").onclick=()=>needAdmin()&&editPayee(null,x=>{$("#wPay").innerHTML=payOpts(x.id);payInfo()},true);
  sh.querySelector("#wC").onclick=closeSheet;
  sh.querySelector("#wS").onclick=async()=>{
    const name=$("#wName").value.trim();if(!name){toast("กรุณาใส่ชื่อ");return}
    if(!curDescs().length&&!(await ask("ยังไม่มีข้อมูลใบหน้า — คนนี้จะสแกนไม่ได้ ต้องลงเวลาด้วยมือ บันทึกเลยไหม?","บันทึก",false)))return;
    w.name=name;w.wage=+$("#wWage").value||0;w.otHr=$("#wOt").value===""?"":+$("#wOt").value;w.role=$("#wRole").value.trim();w.phone=$("#wPhone").value.trim();
    if(!n)w.active=$("#wAct").checked;w.site=$("#wSite").value;w.payee=$("#wPay").value;delete w.pid;
    try{
      if(tmp.full)w.full=await DB.photo(tmp.full);if(tmp.face)w.face=await DB.photo(tmp.face);
      w.descs=curDescs().slice(-12);await saveW(w);S.lastWage=w.wage;
      if(n&&S.pid&&$("#wNow")?.checked){const t=$("#wNowT").value||hmNow();const r=getRec(todayISO(),w.id)||newRec(todayISO(),w);if(!r.in)r.in=t;await saveA(r)}
      closeSheet();toast(n?`ลงทะเบียน ${w.name} แล้ว`:"บันทึกแล้ว");if(pre&&pre.onDone)pre.onDone(w);render();
    }catch(e){toast("บันทึกไม่สำเร็จ ("+(e.message||e)+")")}
  };
  if(!n){
    sh.querySelector("#wDel").onclick=async()=>{if(!needAdmin())return;const mine=(await DB.all("att")).filter(r=>r.wid===w.id);const has=mine.length>0;if(!await ask(has?`${w.name} มีประวัติการลงเวลาแล้ว — แนะนำให้ปิด “ยังทำงานอยู่” แทนการลบ ต้องการลบคนงานและประวัติทั้งหมด?`:`ลบ ${w.name}?`,"ลบ"))return;
      for(const r of mine)await DB.del("att",r.id);S.att=S.att.filter(r=>r.wid!==w.id);await DB.del("workers",w.id);S.workers=S.workers.filter(x=>x.id!==w.id);matcherDirty=true;closeSheet();render()};
    const rs=sh.querySelector("#wReset");if(rs)rs.onclick=async()=>{if(!await ask("ล้างข้อมูลใบหน้าเดิมทั้งหมด แล้วถ่ายใหม่?","ล้าง"))return;w.descs=[];tmp.descs=[];showCount();rs.remove()};
  }
}

/* ================= attendance edit / manual ================= */

  const sh=openSheet(`<h2>${avatar(w)} ${esc(w.name)}<span class="chip all" style="font-size:14px">${thLong(date)}</span></h2>

   <div class="row">${MK.map(k=>fld("r_"+k,MODES[k].t,r[k],"time")).join("")}</div>
   <div class="row"><div class="fld"><label>คิดค่าแรงวันนี้</label><select id="rDay">${[["","อัตโนมัติ (มีเวลาเข้า/ออก = เต็มวัน)"],["1","เต็มวัน"],["0.5","ครึ่งวัน"],["0","ไม่คิดค่าแรง"]].map(([v,l])=>`<option value="${v}" ${String(r.dayF??"")===v?"selected":""}>${l}</option>`).join("")}</select></div>
   ${fld("rOtH","ชั่วโมง OT (เว้นว่าง = คำนวณจากเวลา)",r.otH,"number","อัตโนมัติ",'step="0.5" inputmode="decimal"')}</div>
   <div class="row">${fld("rWage","ค่าแรงวันนี้ (บาท)",r.wage,"number","",'inputmode="decimal"')}${fld("rOtHr","ค่า OT/ชม.",r.otHr,"number","อัตโนมัติ",'inputmode="decimal"')}</div>
   ${micField("rNote","หมายเหตุ",r.note,false,"เช่น ลาครึ่งวันบ่าย")}
   ${fc.length?`<div class="fld"><label>ภาพตอนสแกน</label><div class="thumbs">${fc.map(k=>`<div style="text-align:center;font-size:12px"><img data-ph="${esc(r.faces[k])}" data-view="${esc(r.faces[k])}" style="width:84px;height:84px"><br>${MODES[k].t} ${r[k]}</div>`).join("")}</div></div>`:""}
   <div class="card" id="rCalc" style="margin:0;background:#f6f8fc"></div>
   <div class="acts">${ex?`<button class="btn del" id="rDel">${I("trash")} ลบการลงเวลาวันนี้</button>`:""}<span class="sp"></span><button class="btn" id="rC">ยกเลิก</button><button class="btn pri" id="rS">บันทึก</button></div>`);
  const collect=()=>{MK.forEach(k=>r[k]=$("#r_"+k).value);r.dayF=$("#rDay").value;r.otH=$("#rOtH").value;r.wage=+$("#rWage").value||0;r.otHr=$("#rOtHr").value;r.note=$("#rNote").value.trim()};
  const calc=()=>{collect();const p=pay(r);sh.querySelector("#rCalc").innerHTML=`ค่าแรงปกติ ${p.d} วัน × ${fmt(r.wage)} = <b>${fmt(p.n)}</b> &nbsp;+&nbsp; OT ${p.h} ชม. × ${fmt(otRateHr(r))} = <b>${fmt(p.o)}</b> &nbsp;=&nbsp; <b style="color:var(--navy);font-size:19px">฿${fmt(p.t)}</b>`};
  sh.querySelectorAll("input,select").forEach(i=>i.addEventListener("input",calc));calc();
  sh.querySelectorAll("[data-view]").forEach(i=>i.onclick=()=>viewPhoto(i.dataset.view));
  sh.querySelector("#rC").onclick=closeSheet;
  sh.querySelector("#rS").onclick=async()=>{collect();try{await saveA(r);closeSheet();render();toast("บันทึกแล้ว",1200)}catch(e){toast("บันทึกไม่สำเร็จ")}};
  if(ex)sh.querySelector("#rDel").onclick=async()=>{if(!needAdmin())return;if(!await ask("ลบการลงเวลาของวันนี้?","ลบ"))return;await DB.del("att",r.id);S.att=S.att.filter(x=>x.id!==r.id);closeSheet();render()};
}
function manualSheet(date){
  let mode=suggestMode();
  const sh=openSheet(`<h2>${I("hand",24)} ลงเวลาด้วยมือ</h2>
   <div class="row">${fld("mDate","วันที่",date,"date")}${fld("mTime","เวลา",hmNow(),"time")}</div>

   <div class="fld"><label>เลือกคนงาน <button class="ibtn" id="mAll" style="margin-left:8px">เลือกทั้งหมดที่ยังไม่ลง</button></label><div class="wlist" id="mList"></div></div>
   <p class="hint">ใช้กรณีมาสาย สแกนหน้าไม่ติด หรือลืมสแกน • คนงานใหม่ให้กด “ลงทะเบียนคนงาน” แล้วติ๊ก “ลงเวลาเข้างานวันนี้ด้วย”</p>

      const label=d.wid?(W(d.wid)?.name||""):"ไม่รู้จัก";const tw=g.measureText(label).width+12;g.fillStyle=col;g.fillRect(d.box.x,d.box.y-fs*1.35,tw,fs*1.35);g.fillStyle="#000";g.fillText(label,d.box.x+6,d.box.y-fs*0.12)}

/* ================= PDF ================= */
const PX=7.874; // px per mm (200 dpi)
const NAVY="#1f2f6b",NAVY2="#2c4a9a",GOLD="#b48a55",SOFT="#e8ecf6",GRID="#9aa3b5";
const seg=(window.Intl&&Intl.Segmenter)?new Intl.Segmenter("th",{granularity:"word"}):null;
function font(ctx,size,w=400){ctx.font=`${w} ${size*PX}px Sarabun, Thonburi, sans-serif`}
function wrap(ctx,text,maxW){
  const lines=[];maxW*=PX;
  for(const para of String(text||"").split("\n")){
    const toks=seg?[...seg.segment(para)].map(s=>s.segment):[...para];let line="";
    for(let t of toks){
      if(ctx.measureText(line+t).width<=maxW){line+=t;continue}
      if(line.trim()){lines.push(line.trimEnd());line=""}
      t=t.trimStart();
      if(ctx.measureText(t).width>maxW){for(const ch of t){if(ctx.measureText(line+ch).width>maxW&&line){lines.push(line);line=""}line+=ch}}else line=t;
    }
    lines.push(line);
  }
  return lines;
}
// align by measuring ourselves: iPad Safari ignored ctx.textAlign in the Defect app
function txt(ctx,s,x,y,size,w=400,color="#1b2133",align="left"){s=String(s??"");font(ctx,size,w);ctx.fillStyle=color;ctx.textAlign="left";ctx.textBaseline="top";let px=x*PX;if(align!=="left"){const tw=ctx.measureText(s).width;px-=align==="center"?tw/2:tw}ctx.fillText(s,px,y*PX)}
function fit(ctx,s,maxW,size,w=400){s=String(s??"");font(ctx,size,w);if(ctx.measureText(s).width<=maxW*PX)return s;while(s.length>1&&ctx.measureText(s+"…").width>maxW*PX)s=s.slice(0,-1);return s+"…"}
function rect(ctx,x,y,w,h,fill,stroke,lw=0.25){ctx.beginPath();ctx.rect(x*PX,y*PX,w*PX,h*PX);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw*PX;ctx.stroke()}}
function drawLogo(ctx,img,x,y,h){if(!img)return 0;const w=h*img.naturalWidth/img.naturalHeight;ctx.drawImage(img,x*PX,y*PX,w*PX,h*PX);return w}
async function drawPhoto(ctx,id,x,y,w,h,cover){
  rect(ctx,x,y,w,h,"#eef0f4");if(!id)return;
  try{const img=await loadImg(await DB.src(id));const s=cover?Math.max(w/img.naturalWidth,h/img.naturalHeight):Math.min(w/img.naturalWidth,h/img.naturalHeight);const iw=img.naturalWidth*s,ih=img.naturalHeight*s;
    ctx.save();ctx.beginPath();ctx.rect(x*PX,y*PX,w*PX,h*PX);ctx.clip();ctx.drawImage(img,(x+(w-iw)/2)*PX,(y+(h-ih)/2)*PX,iw*PX,ih*PX);ctx.restore()}catch(e){}
}
class Doc{
  constructor(W,H,header){this.W=W;this.H=H;this.pages=[];this.header=header;this.bottom=H-13;this.newPage()}
  newPage(){this.pages.push({ops:[]});this.y=this.header(this,this.pages.length)}
  add(fn){this.pages[this.pages.length-1].ops.push(fn)}
  need(h){if(this.y+h>this.bottom){this.newPage();return true}return false}
  async render(prog,footer){
    const cv=document.createElement("canvas");cv.width=Math.round(this.W*PX);cv.height=Math.round(this.H*PX);const ctx=cv.getContext("2d");
    const jpgs=[],prev=[];const n=this.pages.length;
    for(let i=0;i<n;i++){prog(`กำลังวาดหน้า ${i+1}/${n}…`,i/n);ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
      for(const op of this.pages[i].ops)await op(ctx);footer(ctx,i+1,n);
      const b=await toBlob(cv,0.86);jpgs.push(new Uint8Array(await b.arrayBuffer()));prev.push(URL.createObjectURL(b))}
    prog("กำลังรวมไฟล์ PDF…",1);
    return {pages:prev,blob:new Blob([makePdf(jpgs,cv.width,cv.height,this.W/25.4*72,this.H/25.4*72)],{type:"application/pdf"})};
  }
}

        cols.forEach((c,i)=>{const v=r[i];const al=c.a||"center";const x=al==="left"?cx[i]+1.5:al==="right"?cx[i+1]-1.5:cx[i]+c.w/2;txt(ctx,fit(ctx,v,c.w-2,3,tot?700:400),x,y+1.5,3,tot?700:400,tot?NAVY:"#1b2133",al)});
        for(let i=0;i<cols.length;i++)rect(ctx,cx[i],y,cols[i].w,6.5,null,GRID)});doc.y+=6.5});doc.y+=6};
    const upto=S.att.filter(r=>r.date<=sun);const ms=[...new Set(upto.map(r=>r.date.slice(0,7)))].sort();const all=summarize(upto).tot;
    tbl(`สรุปค่าแรงรายเดือน (ตั้งแต่เริ่มโครงการ ${thDate(projStart())} ถึง ${thDate(sun)})`,[{t:"เดือน",w:60,a:"left"},{t:"แรงงาน (คน-วัน)",w:38},{t:"OT (ชม.)",w:30},{t:"ค่าแรงปกติ",w:42,a:"right"},{t:"ค่า OT",w:38,a:"right"},{t:"รวม (บาท)",w:45,a:"right"}],
      [...ms.map(k=>{const t=summarize(upto.filter(r=>r.date.startsWith(k))).tot;return [thMonth(k),fmt(t.d),fmt(t.h),fmt(t.n),fmt(t.o),fmt(t.t)]}),["รวมทั้งโครงการ",fmt(all.d),fmt(all.h),fmt(all.n),fmt(all.o),fmt(all.t)]],true);
    const smA=summarize(upto);const wa=sortedWorkers().filter(w=>smA.by.has(w.id));
    tbl("สรุปค่าแรงสะสมรายคน (ทั้งโครงการ)",[{t:"ที่",w:12},{t:"ชื่อ – สกุล",w:70,a:"left"},{t:"ค่าแรง/วัน",w:26},{t:"วันทำงาน",w:26},{t:"OT (ชม.)",w:24},{t:"ค่าแรงปกติ",w:40,a:"right"},{t:"ค่า OT",w:35,a:"right"},{t:"รวม (บาท)",w:44,a:"right"}],
      [...wa.map((w,i)=>{const x=smA.by.get(w.id);return [i+1,w.name,fmt(w.wage),fmt(x.d),fmt(x.h),fmt(x.n),fmt(x.o),fmt(x.t)]}),["",`รวม ${wa.length} คน`,"",fmt(all.d),fmt(all.h),fmt(all.n),fmt(all.o),fmt(all.t)]],true);
  }
  const footer=(ctx,i,n)=>{rect(ctx,M,PH-10.5,TW,0.3,GOLD);txt(ctx,"PRO CONSTRUCTION & DESIGN CO.,LTD.  •  "+(p.name||"")+"  •  DC v"+APP_VER,M,PH-9,2.8,400,"#777");txt(ctx,`หน้า ${i} / ${n}`,PW-M,PH-9,2.9,600,"#555","right")};
  return await doc.render(prog,footer);
}
function makePdf(jpgs,w,h,wPt,hPt){
  const enc=new TextEncoder();const parts=[];let len=0;const off=[];
  const put=d=>{if(typeof d==="string")d=enc.encode(d);parts.push(d);len+=d.length};
  const obj=(n,f)=>{off[n]=len;put(n+" 0 obj\n");f();put("\nendobj\n")};
  put("%PDF-1.4\n%ÿÿ\n");const n=jpgs.length;const W=wPt.toFixed(2),H=hPt.toFixed(2);
  obj(1,()=>put("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>put(`<< /Type /Pages /Kids [${jpgs.map((_,i)=>(3+3*i)+" 0 R").join(" ")}] /Count ${n} >>`));
  jpgs.forEach((j,i)=>{const p=3+3*i;
    obj(p,()=>put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(p+1,()=>put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(p+2,()=>{put(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n`);put(j);put("\nendstream")});
  });
  const info=3+3*n;obj(info,()=>put("<< /Producer (PRO-CON DC App) /Creator (PRO-CON DC App) >>"));
  const size=info+1;const xref=len;
  let x=`xref\n0 ${size}\n0000000000 65535 f \n`;for(let k=1;k<size;k++)x+=String(off[k]).padStart(10,"0")+" 00000 n \n";
  put(x);put(`trailer\n<< /Size ${size} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out=new Uint8Array(len);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out;
}

function renderLogin(msg){
  setTop();$("#bar").style.display="none";syncBadge();
  $("#main").innerHTML=`<div class="card" style="max-width:460px;margin:30px auto"><h3>${I("lock")} เข้าสู่ระบบ</h3>
   <p class="hint" style="margin-top:-4px">ใช้บัญชีที่แอดมินสร้างให้ (เช่น staff2) — ข้อมูลจะซิงก์ร่วมกันทุก iPad</p>
   ${fld("lgEmail","ชื่อผู้ใช้ (เช่น staff1)",(()=>{try{return localStorage.getItem("dc-user")||""}catch(e){return""}})(),"text","พิมพ์ชื่อผู้ใช้ที่นี่",'autocapitalize="off" autocorrect="off" autocomplete="username"')}
   ${fld("lgPass","รหัสผ่าน","","password","",'autocomplete="current-password"')}
   <div class="hint" id="lgMsg" style="color:var(--red)">${esc(msg||"")}</div>
   <div class="acts"><span class="sp"></span><button class="btn pri big" id="lgGo">เข้าสู่ระบบ</button></div></div>
   <p class="hint" style="text-align:center">เวอร์ชัน ${APP_VER}</p>`;
  const go=async()=>{let e=$("#lgEmail").value.trim().toLowerCase();if(e&&!e.includes("@"))e+="@procon.app";const pw=$("#lgPass").value;if(!e){$("#lgMsg").textContent="กรุณาพิมพ์ชื่อผู้ใช้ในช่องแรก (เช่น staff1)";$("#lgEmail").focus();return}if(!pw){$("#lgMsg").textContent="กรุณาใส่รหัสผ่าน";$("#lgPass").focus();return}
    try{localStorage.setItem("dc-user",e.replace("@procon.app",""))}catch(_){}
    $("#lgGo").disabled=true;$("#lgMsg").textContent="กำลังเข้าสู่ระบบ…";
    try{await firebase.auth().signInWithEmailAndPassword(e,pw)}catch(err){$("#lgGo").disabled=false;const c=err&&err.code||"";
      $("#lgMsg").textContent=/invalid|wrong-password|user-not-found/.test(c)?"อีเมลหรือรหัสผ่านไม่ถูกต้อง":c==="auth/network-request-failed"?"ไม่มีอินเทอร์เน็ต — การเข้าสู่ระบบครั้งแรกต้องต่อเน็ต":c==="auth/too-many-requests"?"ลองผิดหลายครั้ง กรุณารอสักครู่":"เข้าสู่ระบบไม่สำเร็จ ("+c+")"}};
  $("#lgGo").onclick=go;$("#lgPass").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function localSummary(){
  try{if(localStorage.getItem("dc-migrated"))return""}catch(e){}
  const w=(await LocalDB.all("workers")).length,a=(await LocalDB.all("att")).length,p=(await LocalDB.all("projects")).filter(x=>x.id!=="_cfg").length;
  return (w||a||p)?`${p} โครงการ • ${w} คนงาน • ${a} รายการลงเวลา`:"";
}
async function migrateToCloud(){
  if(!needAdmin())return;
  if(!await ask(`ย้ายข้อมูลเดิมใน iPad เครื่องนี้ (${S.migrateInfo}) ขึ้นคลาวด์ เพื่อให้ทุกเครื่องเห็น? (ข้อมูลที่ id ซ้ำจะถูกแทนที่ / ข้อมูลในเครื่องยังอยู่)`,"ย้ายข้อมูล",false))return;
  try{
    const keys=await LocalDB.photoKeys();let i=0;
    for(const k of keys){const b=await LocalDB.blob(k);if(b)await CloudDB.putPhoto(k,b);if(++i%5===0)toast(`กำลังส่งรูป ${i}/${keys.length}…`,20000)}
    for(const st of STORES)for(const x of await LocalDB.all(st))await CloudDB.put(st,x);
    try{localStorage.setItem("dc-migrated","1")}catch(e){}S.migrateInfo="";
    await refreshState();render();toast("ย้ายข้อมูลแล้ว — ข้อมูลจะทยอยขึ้นคลาวด์ (ดูสถานะมุมขวาบน)",5000);
  }catch(e){console.error(e);toast("ย้ายข้อมูลไม่สำเร็จ: "+(e.message||e),5000)}
}

/* ================= boot ================= */
(async function boot(){
  await LocalDB.init();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  setTimeout(()=>ensureFace().catch(()=>{}),1500);// preload the face models so the first scan is quick
  if(window.firebase&&window.FIREBASE_CONFIG){
    firebase.initializeApp(FIREBASE_CONFIG);
    try{await firebase.firestore().enablePersistence({synchronizeTabs:true})}catch(e){console.warn("persistence",e&&e.code)}
    CloudDB.init();DB=CloudDB;
    firebase.auth().onAuthStateChanged(async u=>{
      USER=u;
      if(!u){CloudDB.stop();S.pid=null;renderLogin();return}
      $("#main").innerHTML=`<div class="empty-state">กำลังโหลดข้อมูล…</div>`;
      await CloudDB.start();S.migrateInfo=await localSummary();await refreshState();syncBadge();render();
    });
    return;
  }
  // no cloud config: data stays on this device only
  {const all=await DB.all("projects");await loadCfg(all);S.projects=all.filter(x=>x.id!=="_cfg")}await loadWorkers();
  render();
})();
</script>
